
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Issues Slideshow</title>
<style>
body {
  background:#000;
  color:#eee;
  font-family: Segoe UI, Arial, sans-serif;
  margin:0;
  padding:10px;

}

.slideshow {
  display:flex;
  flex-direction:column;
  height:500px; /* fixed frame height */
}

.image-area {
  flex:1;
  display:flex;
  align-items:center;      /* vertical center */
  justify-content:center;  /* horizontal center */
}

.slideshow img {
  max-width:100%;
  max-height:380px;
  object-fit:contain;
  border-radius:10px;
  box-shadow:0 0 15px rgba(0,0,0,0.7);
}

.caption {
  text-align:center;
  margin-top:4px;
  color:#ccc;
}

.button-row {
  margin-top:auto; /* pushes buttons to bottom */
  text-align:center;
  padding-top:20px;
}

button {
  background:#111;
  color:#4da3ff;
  border:1px solid #4da3ff55;
  padding:10px 20px;
  margin:10px;
  border-radius:6px;
  cursor:pointer;
  font-size:1em;
}

button:hover {
  background:#4da3ff22;
}
</style>
</head>

<body>

<div class="slideshow">

  <div class="image-area">
    <img id="slideImage" src="complaints/complaint_4.png" alt="Slideshow image">
  </div>

  <div class="caption" id="slideCaption">complaint_4</div>

  <div class="button-row">
    <button onclick="prevSlide()">⟵ Previous</button>
    <button onclick="nextSlide()">Next ⟶</button>
  </div>

</div>

<script>
const images = ["complaint_4.png","complaint_5.png","denied_insurance_claim.jpg","garland_capacity.png","over_capacity_review_whitefield.png","party_house.png","unnamed.png","whitefield_capacity.png"];
const captions = ["complaint_4","complaint_5","denied_insurance_claim","garland_capacity","over_capacity_review_whitefield","party_house","unnamed","whitefield_capacity"];
let index = 0;

function updateSlide() {
    document.getElementById("slideImage").src = "complaints/" + images[index];
    document.getElementById("slideCaption").textContent = captions[index];
}

function nextSlide() {
    index = (index + 1) % images.length;
    updateSlide();
}

function prevSlide() {
    index = (index - 1 + images.length) % images.length;
    updateSlide();
}
</script>

</body>
</html>
