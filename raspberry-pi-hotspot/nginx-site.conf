map $remote_addr $portal_address {
    default 10.42.0.1;
    ~^10\.43\. 10.43.0.1;
}
limit_req_zone $binary_remote_addr zone=portal_api:10m rate=30r/m;
server {
    listen 80 default_server;
    server_name _;
    return 302 http://$portal_address/bed-bug-bordello.html;
}

server {
    listen 80;
    server_name 10.42.0.1 10.43.0.1 192.168.1.151 airbnb.wifi captive-portal.local localhost;
    root /var/www/airbnb-wifi;
    index index.html;
    add_header Cache-Control "no-cache" always;

    location /api/ {
        client_max_body_size 8k;
        limit_req zone=portal_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = / {
        return 302 /bed-bug-bordello.html;
    }

    # Redirect common phone/laptop captive-network probes to the local site.
    location ~ ^/(generate_204|gen_204|hotspot-detect\.html|library/test/success\.html|connecttest\.txt|ncsi\.txt|canonical\.html|success\.txt|redirect|check_network_status\.txt)$ {
        return 302 http://$portal_address/bed-bug-bordello.html;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

# Hotspot interfaces cannot access port 8081 (blocked by the input firewall).
server {
    # Start even when Ethernet has no address. ACL and firewall protect admin.
    listen 8081;
    server_name _;
    allow 192.168.1.0/24;
    allow 127.0.0.1;
    deny all;
    location = / { return 302 /admin; }
    location /admin {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
