<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pi portal visits and guestbook</title><style>body{font:16px/1.5 system-ui;max-width:1100px;margin:40px auto;padding:0 20px}table{border-collapse:collapse;width:100%;margin:20px 0}th,td{padding:10px;border:1px solid #ddd;text-align:left;vertical-align:top}td{white-space:pre-wrap;overflow-wrap:anywhere}a{margin-right:20px}</style><h1>Pi portal visits and guestbook</h1><p id="stats">Loading…</p><a href="/admin/visits.csv">Download visit log (CSV)</a><a href="/admin/guestbook.csv">Download guestbook responses (CSV)</a><h2>Guestbook responses</h2><div id="guestbook"></div><h2>Recent visits</h2><div id="visits"></div><script>
const time=value=>new Date(value).toLocaleString('en-US',{timeZone:'America/New_York'});
function table(target,headers,rows){const t=document.createElement('table');const head=t.insertRow();headers.forEach(h=>{const th=document.createElement('th');th.textContent=h;head.append(th)});rows.forEach(values=>{const tr=t.insertRow();values.forEach(value=>{const td=tr.insertCell();td.textContent=value})});document.querySelector(target).replaceChildren(t)}
async function refresh(){const r=await fetch('/admin/data');const d=await r.json();document.querySelector('#stats').textContent=`${d.visitors} visitors · ${d.visits} visits · Times shown in Eastern time`;table('#guestbook',['When','Name','Message','Network'],d.guestbook.map(r=>[time(r.submitted_at),r.name,r.message,r.hotspot]));table('#visits',['When','Page','Network'],d.recent_visits.map(r=>[time(r.visited_at),r.page,r.hotspot]))}refresh();setInterval(refresh,15000);
</script></html>
