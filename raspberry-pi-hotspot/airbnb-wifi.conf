# Only serve hotspot clients; leave Ethernet's existing network configuration alone.
interface=wlan0
bind-dynamic
dhcp-authoritative
dhcp-range=10.42.0.20,10.42.0.200,255.255.255.0,12h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
address=/airbnb.wifi/10.42.0.1
# Every hostname points to the local portal. Never query upstream DNS for visitors.
no-resolv
address=/#/10.42.0.1
local=/#/
domain-needed
bogus-priv
